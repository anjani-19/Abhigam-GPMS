<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Shield Shape with Glow -->
  <g filter="url(#shadow)">
    <path d="M 256,96 C 330,96 384,118 384,118 C 384,240 340,356 256,416 C 172,356 128,240 128,118 C 128,118 182,96 256,96 Z" fill="url(#shield)" />
    <!-- Inner Emblem: Checkmark & Gate Pass Key -->
    <path d="M 220,270 L 180,230 L 155,255 L 220,320 L 355,185 L 330,160 Z" fill="#2563eb" />
  </g>
</svg>
